{% extends "index.html" %}

{% block title %}Destinos{% endblock %}

{% block content %}
<h1>Destinos</h1>
<ul>
    {% for destination in data_destinations %}
    <li>
        <strong>
            <a href="{{ url_for('data_destination', destination_id=destination.id) }}">
                {{ destination.name }}

            </a>
        </strong>
    </li>
    {% endfor %}
</ul>
{% endblock %}
