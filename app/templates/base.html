<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tu Viaje a Medida{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header>
        <a class="logo" href="{{ url_for('inicio') }}">Tu Viaje a Medida</a>
        <nav>
            <a href="{{ url_for('inicio') }}">Inicio</a>
            <a href="{{ url_for('acerca') }}">Acerca de nosotros</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; Tu Viaje a Medida · Turismo de calidad y experiencias personalizadas</p>
    </footer>
</body>

</html>
